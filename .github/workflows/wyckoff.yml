name: Wyckoff scanner
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node github_scan.mjs
      - name: Commit alerts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/wyckoff-alerts.json public/health.json
          git diff --cached --quiet || git commit -m "Update Wyckoff alerts"
          git push
